site_name: TreeRing
site_description: >-
  TreeRing is an open-source least-knowledge security layer for LLM agents:
  prompt-injection isolation, provenance-tagged values, human-in-the-loop approval,
  and a tamper-evident hash-chained audit log. Inspired by tree rings.
site_url: https://jiwoomap.github.io/treering/
site_author: jiwoomap
repo_url: https://github.com/jiwoomap/treering
repo_name: jiwoomap/treering
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 jiwoomap — Apache-2.0

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: [en, ko]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jiwoomap/treering
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/treering/

nav:
  - Overview: index.md
  - How it works: concepts.md
  - Manifest reference: manifest.md
  - Principles: principles.md
  - Threat model & limits: threat-model.md
  - Related work: related-work.md
  - FAQ: faq.md
  - Roadmap: roadmap.md
  - 한국어: ko.md
